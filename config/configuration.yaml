# Loads default set of integrations. Do not remove.
default_config:

# Load frontend themes from the themes folder
frontend:
  themes: !include_dir_merge_named themes

automation: !include_dir_merge_list automations/
script: !include scripts.yaml
scene: !include scenes.yaml

template:

input_boolean:
  night_mode:
    name: Night Mode
    icon: mdi:weather-night
  movie_mode:
    name: Movie Mode
    icon: mdi:movie-open

input_number:
  timeout_motion_normal:
    name: Motion Timeout Normal
    min: 30
    max: 600
    step: 10
    unit_of_measurement: s
  timeout_motion_normal_long:
    name: Motion Timeout Normal Long
    min: 60
    max: 600
    step: 10
    unit_of_measurement: s
  timeout_motion_night:
    name: Motion Timeout Night
    min: 5
    max: 120
    step: 5
    unit_of_measurement: s
  timeout_motion_night_short:
    name: Motion Timeout Night Short
    min: 5
    max: 60
    step: 5
    unit_of_measurement: s
  timeout_motion_movie:
    name: Motion Timeout Movie
    min: 5
    max: 120
    step: 5
    unit_of_measurement: s
  transition_on:
    name: Light Transition On
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: s
  transition_off:
    name: Light Transition Off
    min: 0
    max: 10
    step: 0.5
    unit_of_measurement: s

panel_custom:
  - name: custom-dashboard-panel
    sidebar_title: Claude Kit
    sidebar_icon: mdi:view-dashboard-variant
    url_path: custom-dashboard
    module_url: /local/custom-dashboard/panel.js

lovelace:
  mode: storage

recorder:
  purge_keep_days: 14
