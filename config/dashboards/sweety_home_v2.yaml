title: Sweety Home v2
theme: Glass Cozy Dark
background:
  image: "https://images.unsplash.com/photo-1519681393784-d120267933ba?auto=format&fit=crop&w=1920&q=80"

views:
  # ==========================================================================
  # HOME TAB
  # ==========================================================================
  - title: Home
    path: home
    icon: mdi:home-heart
    theme: Glass Cozy Dark
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Welcome Home
            icon: mdi:home-heart

      - type: grid
        column_span: 4
        cards:
          - type: horizontal-stack
            cards:
              - type: custom:mushroom-template-card
                primary: Welcome
                icon: mdi:door-open
                icon_color: amber
                fill_container: true
                tap_action:
                  action: call-service
                  service: scene.turn_on
                  target:
                    entity_id: scene.welcome_home
              - type: custom:mushroom-template-card
                primary: Lights Off
                icon: mdi:lightbulb-off-outline
                icon_color: grey
                fill_container: true
                tap_action:
                  action: call-service
                  service: light.turn_off
                  target:
                    entity_id: all

      - type: grid
        column_span: 2
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Living Room
            sub_label: 1st Floor
            icon: mdi:sofa
            tap_action:
              action: navigate
              navigation_path: /sweety-home-v2/living-room
            sub_button:
              - entity: light.living_room_down_lights
                show_background: true
                show_state: false
                tap_action: { action: toggle }
              - entity: climate.living_room_ac_living_room_ac
                show_state: true
                show_background: false

      - type: grid
        column_span: 2
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Kitchen
            sub_label: 1st Floor
            icon: mdi:fridge
            tap_action:
              action: navigate
              navigation_path: /sweety-home-v2/kitchen
            sub_button:
              - entity: light.kitchen_light_7
                show_background: true
                show_state: false
                tap_action: { action: toggle }
              - entity: light.kitchen_light_8
                show_background: true
                show_state: false
                tap_action: { action: toggle }

      - type: grid
        column_span: 2
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Master Bedroom
            sub_label: 2nd Floor
            icon: mdi:bed-double
            tap_action:
              action: navigate
              navigation_path: /sweety-home-v2/master-bedroom
            sub_button:
              - entity: light.master_bedroom_lights
                show_background: true
                show_state: false
                tap_action: { action: toggle }
              - entity: climate.master_bedroom_ac_master_bedroom_ac
                show_state: true
                show_background: false

      - type: grid
        column_span: 2
        cards:
          - type: custom:bubble-card
            card_type: button
            button_type: name
            name: Study Room
            sub_label: 2nd Floor
            icon: mdi:chair-rolling
            tap_action:
              action: navigate
              navigation_path: /sweety-home-v2/study-room
            sub_button:
              - entity: light.study_room_lights
                show_background: true
                show_state: false
                tap_action: { action: toggle }
              - entity: climate.study_room_ac_study_room_ac
                show_state: true
                show_background: false

      # --- Power consumption ---
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Power Consumption
            icon: mdi:lightning-bolt

      - type: grid
        column_span: 4
        cards:
          - type: custom:mini-graph-card
            name: Power
            icon: mdi:flash
            entities:
              - entity: sensor.energy_monitor_pzem_004t_v3_power
                name: Power
                color: "#f9e2af"
                show_state: true
            hours_to_show: 24
            points_per_hour: 12
            line_width: 2
            smoothing: true
            decimals: 0
            show:
              labels: true
              extrema: true
              fill: fade
              average: true

      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: entity
                entity: sensor.energy_monitor_pzem_004t_v3_power
                icon: mdi:flash
                icon_color: amber
                content_info: state
              - type: entity
                entity: sensor.energy_monitor_pzem_004t_v3_voltage
                icon: mdi:sine-wave
                icon_color: blue
                content_info: state
              - type: entity
                entity: sensor.energy_monitor_pzem_004t_v3_current
                icon: mdi:current-ac
                icon_color: orange
                content_info: state
              - type: entity
                entity: sensor.energy_monitor_pzem_004t_v3_energy
                icon: mdi:counter
                icon_color: green
                content_info: state

      # --- House overview chips ---
      - type: grid
        column_span: 4
        cards:
          - type: custom:mushroom-chips-card
            alignment: center
            chips:
              - type: template
                icon: mdi:lightbulb-on
                icon_color: amber
                content: >-
                  {{ states.light | selectattr('state','eq','on') | list | count }}
                  on
              - type: template
                icon: mdi:thermometer
                icon_color: red
                content: >-
                  {{ states('sensor.dht_temperature') }}°C
              - type: template
                icon: mdi:water-percent
                icon_color: blue
                content: >-
                  {{ states('sensor.dht_humidity') }}%
              - type: conditional
                conditions:
                  - condition: state
                    entity: weather.forecast_home
                    state_not: unavailable
                chip:
                  type: weather
                  entity: weather.forecast_home
                  show_temperature: true
                  show_conditions: true

  # ==========================================================================
  # LIVING ROOM TAB
  # ==========================================================================
  - title: Living Room
    path: living-room
    icon: mdi:sofa
    theme: Glass Cozy Dark
    type: sections
    max_columns: 4
    sections:
      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Lights
            icon: mdi:lightbulb-group

      - type: grid
        column_span: 4
        cards:
          - type: grid
            columns: 2
            square: false
            cards:
              - type: custom:mushroom-light-card
                entity: light.living_room_down_lights
                name: All Down Lights
                icon: mdi:ceiling-light-multiple
                show_brightness_control: true
                use_light_color: true
                collapsible_controls: false
                fill_container: true
              - type: custom:mushroom-light-card
                entity: light.center_light_4
                name: Center
                icon: mdi:ceiling-light
                show_brightness_control: true
                use_light_color: true
                collapsible_controls: false
                fill_container: true
              - type: custom:mushroom-light-card
                entity: light.leftrightlights_light
                name: Left/Right
                icon: mdi:wall-sconce
                show_brightness_control: true
                use_light_color: true
                collapsible_controls: false
                fill_container: true
              - type: custom:mushroom-light-card
                entity: light.living_room_ac_tv
                name: TV Ambient
                icon: mdi:television-ambient-light
                show_brightness_control: true
                use_light_color: true
                collapsible_controls: false
                fill_container: true
              - type: custom:mushroom-light-card
                entity: light.master_living_room
                name: Master
                icon: mdi:floor-lamp
                show_brightness_control: true
                use_light_color: true
                collapsible_controls: false
                fill_container: true
              - type: custom:mushroom-light-card
                entity: light.center_light_6
                name: Spare
                icon: mdi:lightbulb-outline
                show_brightness_control: true
                use_light_color: true
                collapsible_controls: false
                fill_container: true

      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Media
            icon: mdi:television

      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: media-player
            entity: media_player.sweety_tv
            name: Living Room TV

      - type: grid
        column_span: 4
        cards:
          - type: thermostat
            entity: climate.living_room_ac_living_room_ac
            features:
              - type: climate-hvac-modes
                hvac_modes:
                  - "off"
                  - cool
                  - dry
                  - fan_only

      - type: grid
        column_span: 4
        cards:
          - type: custom:bubble-card
            card_type: separator
            name: Climate Trend
            icon: mdi:thermometer-lines

      - type: grid
        column_span: 4
        cards:
          - type: custom:mini-graph-card
            name: Climate Trend
            icon: mdi:thermometer-lines
            entities:
              - entity: sensor.dht_temperature
                name: Temperature
                color: "#fab387"
              - entity: sensor.dht_humidity
                name: Humidity
                color: "#89b4fa"
                y_axis: secondary
                show_state: true
            hours_to_show: 24
            points_per_hour: 4
            line_width: 2
            smoothing: true
            show:
              labels: false
              extrema: true
              fill: fade

