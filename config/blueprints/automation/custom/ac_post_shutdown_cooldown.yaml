blueprint:
  name: A/C Post-Shutdown Fan Cool-Down
  description: >
    When the A/C turns off manually or after cooling,
    switch to fan-only high speed for a duration, then turn off completely.
  domain: automation

  input:
    climate_entity:
      name: Air Conditioner (climate entity)
      selector:
        entity:
          domain: climate
    high_fan_mode:
      name: High Fan Mode Name
      description: >
        The name of the "high" fan speed as reported by your A/C entity
        (e.g. 'high', 'max', 'strong').
      default: "high"
    auto_fan_mode:
      name: Auto Fan Mode Name
      description: >
        The name of the "auto" fan speed as reported by your A/C entity.
      default: "auto"
    cooldown_duration:
      name: Fan-Only Duration (minutes)
      description: Duration to run the fan before turning off.
      default: 15
      selector:
        number:
          min: 1
          max: 60
          unit_of_measurement: minutes
          mode: box

mode: restart

trigger:
  - platform: state
    entity_id: !input climate_entity
    to: "off"

condition:
  - condition: template
    value_template: >
      {{ trigger.from_state is not none and
         trigger.from_state.state in ['cool','dry','heat_cool','heat','auto'] }}

action:
  - alias: "Switch to fan-only mode"
    action: climate.set_hvac_mode
    target:
      entity_id: !input climate_entity
    data:
      hvac_mode: fan_only

  - alias: "Set fan speed to high"
    action: climate.set_fan_mode
    target:
      entity_id: !input climate_entity
    data:
      fan_mode: !input high_fan_mode

  - alias: "Wait for cooldown period"
    delay:
      minutes: !input cooldown_duration

  - alias: "Set fan speed to auto"
    action: climate.set_fan_mode
    target:
      entity_id: !input climate_entity
    data:
      fan_mode: !input auto_fan_mode

  - alias: "Turn off the A/C"
    action: climate.turn_off
    target:
      entity_id: !input climate_entity
