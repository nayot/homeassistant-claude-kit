esphome:
  name: study-room-ac
  friendly_name: Study Room AC

esp8266:
  board: esp01_1m

# Enable logging
logger:

# Enable Home Assistant API
api:
  encryption:
    key: "Rj1ek+tpt2bmFG4ccZAB7lm0iPCjwTaMJrzKK0pehKo="

ota:
  password: "9a1b893bcac3ffe9c90c9df49ae466e9"

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password

  # Enable fallback hotspot (captive portal) in case wifi connection fails
  ap:
    ssid: "Study-Room-Ac Fallback Hotspot"
    password: "pVioJszLEbJs"

captive_portal:


# Use the blue LED as a status light.
#   Blink slowly = Temporary issue (WiFi/MQTT disconnected, sensor unavailable, ...)
#   Blink quickly = Error encountered
status_led:
  pin: GPIO4 #checked

# Configure the IR receiver. Handy to pickup confirmation messages
# from your AC (or capture commands from the actual remote)
remote_receiver:
  id: rcvr
  pin: 
    number: GPIO5 #checked
    inverted: True
  dump: all

# Configure the IR LED: this one sends commands to other devices
remote_transmitter:
  pin: GPIO14 #checked
  carrier_duty_percent: 50%
  
climate:
  - platform: daikin
    name: "Study Room AC"
    receiver_id: rcvr