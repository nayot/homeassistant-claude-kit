# Lighting Automations — Motion On/Off for Kitchen and Hallway
#
# Pattern: motion sensor 'to: off + for:' — never use delay or wait_for_trigger
# Timeouts are input_number helpers configured in the dashboard Settings view

# ── Kitchen: Motion On ────────────────────────────────────────────────────────

- id: kitchen_light_motion_on
  alias: Kitchen Light - On
  description: Turn on kitchen lights when motion detected
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion_motion
    to: 'on'
  conditions: []
  actions:
  - action: light.turn_on
    target:
      entity_id: light.kitchen_light_7
    data:
      transition: '{{ states(''input_number.transition_on'') | int(1) }}'
  mode: restart


# ── Kitchen: Motion Off ───────────────────────────────────────────────────────

- id: kitchen_light_motion_off
  alias: Kitchen Light - Off
  description: Turn off kitchen lights after motion clears
  triggers:
  - trigger: state
    entity_id: binary_sensor.kitchen_motion_motion
    to: 'off'
    for:
      seconds: >
        {% if is_state('input_boolean.night_mode', 'on') %}
          {{ states('input_number.timeout_motion_night') | int(30) }}
        {% elif is_state('input_boolean.movie_mode', 'on') %}
          {{ states('input_number.timeout_motion_movie') | int(15) }}
        {% else %}
          {{ states('input_number.timeout_motion_normal') | int(120) }}
        {% endif %}
  actions:
  - action: light.turn_off
    target:
      entity_id: light.kitchen_light_7
    data:
      transition: '{{ states(''input_number.transition_off'') | int(3) }}'
  mode: single
