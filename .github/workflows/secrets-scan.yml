name: Secrets Scan

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  trufflehog:
    name: TruffleHog Secrets Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: TruffleHog OSS
        uses: trufflesecurity/trufflehog@bcfcf73aaf4759d4dadc2783177c245a02792318 # v3.97.0
        with:
          path: ./
          # No base/head: the action derives them per event — for a push,
          # github.event.before..after (the commits actually pushed); for a PR,
          # the PR's base and head SHAs. Pinning base to the default branch and
          # head to HEAD made both resolve to the same commit on a push to main,
          # so every push run died on "BASE and HEAD commits are the same".
          extra_args: --debug --only-verified
